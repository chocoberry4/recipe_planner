default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: recipe_planner_development
  username: postgres
  password: postgres
  host: localhost
  port: 5432

test:
  <<: *default
  database: recipe_planner_test
  username: postgres
  password: postgres
  host: localhost
  port: 5432

production:
  primary: &primary_production
    <<: *default
    database: recipe_planner_production
    username: recipe_planner
    password: <%= ENV["RECIPE_PLANNER_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: recipe_planner_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: recipe_planner_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: recipe_planner_production_cable
    migrations_paths: db/cable_migrate
