# Name of your application. Used to uniquely configure containers.
service: recipe_planner

# Default (30s) is too tight for an e2-micro (1 shared vCPU, 1GB RAM):
# cold boot means a fresh bootsnap compile plus first-time migrations
# against a Postgres accessory that just started. Give it more room.
deploy_timeout: 120

# Name of the container image. Reuses the GHCR path already verified working
# in CI (docker/build-push-action) - a GH PAT with write:packages scope goes
# in KAMAL_REGISTRY_PASSWORD below. Kamal prepends registry.server itself, so
# this is just the owner/repo, not the full ghcr.io/... path.
image: chocoberry4/recipe_planner

# Deploy to these servers. SERVER_HOST isn't set yet - fill it in once a real
# box (e.g. an Oracle Always Free VM) exists, as an env var locally or as the
# SERVER_HOST repo variable in CI.
servers:
  web:
    - <%= ENV.fetch("SERVER_HOST") %>
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# No domain yet, so SSL/Let's Encrypt is off for now - the app is reachable
# directly at http://<SERVER_HOST>. Turn this back on with ssl: true and a
# real host: once there's a domain pointed at the server.
proxy:
  ssl: false

# Credentials for your image host.
registry:
  server: ghcr.io
  username: chocoberry4

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - RECIPE_PLANNER_DATABASE_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Postgres runs as the "db" accessory below, reachable on Kamal's local
    # docker network at recipe_planner-db.
    DB_HOST: recipe_planner-db

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "recipe_planner_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path. This app builds assets via Vite (see
# config/vite.json), not Sprockets/Propshaft, so the output lives in
# public/vite rather than the default public/assets.
asset_path: /rails/public/vite

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.6
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Postgres runs as an accessory on the same box as the web server (matches
# docker-compose.yml's postgres:18). rails db:prepare, already run by
# bin/docker-entrypoint on every boot, creates the sibling cache/queue/cable
# databases alongside the primary one on first deploy.
accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("SERVER_HOST") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: recipe_planner
        POSTGRES_DB: recipe_planner_production
      secret:
        # Same password value as the app's RECIPE_PLANNER_DATABASE_PASSWORD
        # above, just under the env var name the postgres image itself reads
        # on first boot - see .kamal/secrets.
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
#   redis:
#     image: redis:7.0
#     host: 192.168.0.2
#     port: 6379
#     directories:
#       - data:/data
