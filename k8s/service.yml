---
# Service for Rails Application
apiVersion: v1
kind: Service
metadata:
  name: recipe-planner
  labels:
    app: recipe-planner
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: recipe-planner
  sessionAffinity: ClientIP  # Sticky sessions for better user experience
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
